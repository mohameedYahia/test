name: Build social image

on:
  push:
    paths:
      - 'social-post-assets/chunk*.txt'
      - '.github/workflows/build-social-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild JPEG
        run: |
          cat social-post-assets/chunk1.txt social-post-assets/chunk2.txt social-post-assets/chunk3.txt social-post-assets/chunk4.txt | tr -d '\n\r ' | base64 --decode > social-post-assets/sunday-ai-workflow-fixed.jpg
          file social-post-assets/sunday-ai-workflow-fixed.jpg
      - name: Commit rebuilt image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-post-assets/sunday-ai-workflow-fixed.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild approved social image'
          git push
